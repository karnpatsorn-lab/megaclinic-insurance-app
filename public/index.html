<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ประกันกลุ่ม เมกะคลินิก</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<div id="login-screen" class="center-screen" style="display:none;">
  <div class="login-box">
    <img src="/logo.png" class="logo" style="max-width:140px;margin-bottom:20px;" alt="Mega Clinic">
    <h2 style="margin-top:0;">เข้าสู่ระบบ HR</h2>
    <form id="login-form">
      <div class="field">
        <label>ชื่อผู้ใช้</label>
        <input type="text" id="login-username" required>
      </div>
      <div class="field">
        <label>รหัสผ่าน</label>
        <input type="password" id="login-password" required>
      </div>
      <button class="btn btn-brand" type="submit" style="width:100%;">เข้าสู่ระบบ</button>
      <div class="error-text" id="login-error"></div>
    </form>
    <p class="muted" style="margin-top:20px;">พนักงานที่ต้องการแจ้งข้อมูลญาติ <a href="/self-service">คลิกที่นี่</a> (ไม่ต้องเข้าสู่ระบบ)</p>
  </div>
</div>

<div id="app-shell" class="app-shell" style="display:none;">
  <div class="sidebar">
    <img src="/logo.png" class="logo" alt="Mega Clinic">
    <nav>
      <a class="nav-item" data-view="dashboard">แดชบอร์ด</a>
      <a class="nav-item" data-view="roster">รายชื่อพนักงาน</a>
      <a class="nav-item" data-view="export">ส่งออกไฟล์ประกัน</a>
    </nav>
    <div style="margin-top:auto;">
      <div class="muted" id="whoami" style="margin-bottom:10px;"></div>
      <button class="btn btn-ghost" id="logout-btn" style="width:100%;">ออกจากระบบ</button>
    </div>
  </div>
  <div class="main">
    <div id="view-root"></div>
  </div>
</div>

<script src="/admin.js"></script>
</body>
</html>
